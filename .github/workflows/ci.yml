name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Les deux jobs ne font que lire le dépôt : on retire au GITHUB_TOKEN tout le
# reste plutôt que de lui laisser les permissions par défaut du dépôt.
permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, tests, boundaries
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arr
          POSTGRES_PASSWORD: arr
          POSTGRES_DB: arr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arr -d arr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      TZ: UTC
      PORT: 3333
      HOST: localhost
      LOG_LEVEL: info
      APP_KEY: ci-test-app-key-not-for-production-use
      APP_URL: http://localhost:3333
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: arr
      DB_PASSWORD: arr
      DB_DATABASE: arr_test

    steps:
      - uses: actions/checkout@v7

      # Before setup-node, so that `cache: pnpm` finds the pnpm shim on PATH
      # and can resolve the store directory.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Action tierce épinglée sur un SHA : un tag est déplaçable, donc pas un
      # point fixe vérifiable. Dependabot suit le commentaire de version.
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks (lint + typecheck + tests + boundary lint)
        run: task check

  build:
    name: Build
    runs-on: ubuntu-latest

    # `tsc --noEmit` in `task check` does not exercise the real build pipelines
    # (AdonisJS assembler, Vite/TanStack Start), so a green check can still ship
    # a broken build. No database needed here.
    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build both packages
        run: task build

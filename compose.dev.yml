# Dev override: hot reload via mounted source, dev servers instead of built
# artifacts. Usage: docker compose -f compose.yml -f compose.dev.yml up
services:
  backend:
    build:
      target: deps
    command: ['pnpm', '--filter', 'arr-backend', 'run', 'dev']
    environment:
      NODE_ENV: development
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
      - /app/node_modules
    ports:
      - '${BACKEND_PORT:-3333}:3333'
    healthcheck:
      disable: true

  frontend:
    build:
      target: deps
    command: ['pnpm', '--filter', 'arr-frontend', 'run', 'dev']
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
      - /app/node_modules
    healthcheck:
      disable: true

  reconciler:
    build:
      target: deps
    command: ['node', 'ace', 'requests:reconcile']
    environment:
      NODE_ENV: development
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
      - /app/node_modules
    working_dir: /app/backend

  # Base compose.yml's nginx waits on backend/frontend service_healthy, but
  # their healthchecks are disabled above in dev mode — service_healthy would
  # never resolve, so downgrade to service_started here.
  nginx:
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started

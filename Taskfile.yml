version: '3'

vars:
  BACKEND: arr-backend
  FRONTEND: arr-frontend

tasks:
  setup:
    desc: Install dependencies, copy .env files, build once.
    cmds:
      - pnpm install
      - cmd: cp -n .env.example .env
        ignore_error: true
      - cmd: cp -n backend/.env.example backend/.env
        ignore_error: true
      - task: build

  dev:
    desc: Run the full dev stack (db in Docker, backend + frontend as local processes).
    deps: [dev:db]
    cmds:
      - task: dev:back
      - task: dev:front

  dev:db:
    desc: Start only the Postgres container.
    cmds:
      - docker compose -f compose.yml up -d db

  dev:back:
    desc: Run the backend dev server locally (HMR).
    dir: backend
    cmds:
      - pnpm run dev

  dev:front:
    desc: Run the frontend dev server locally against the real backend.
    dir: frontend
    env:
      VITE_CONNECTOR: http
    cmds:
      - pnpm run dev

  dev:fake:
    desc: Run the frontend alone against FakeArrConnector — no backend/db needed.
    dir: frontend
    env:
      VITE_CONNECTOR: fake
    cmds:
      - pnpm run dev

  db:migrate:
    desc: Run pending database migrations.
    dir: backend
    cmds:
      - node ace migration:run

  db:rollback:
    desc: Roll back the last migration batch.
    dir: backend
    cmds:
      - node ace migration:rollback

  db:seed:
    desc: Run database seeders.
    dir: backend
    cmds:
      - node ace db:seed

  db:reset:
    desc: Drop, re-migrate and reseed the database.
    dir: backend
    cmds:
      - node ace migration:fresh
      - node ace db:seed

  test:
    desc: Run every test suite (backend + frontend).
    cmds:
      - task: test:back
      - task: test:front

  test:back:
    desc: Run backend tests (Japa).
    dir: backend
    cmds:
      - pnpm run test

  test:front:
    desc: Run frontend tests (Vitest, FakeArrConnector).
    dir: frontend
    cmds:
      - pnpm run test

  test:contract:
    desc: Run the ArrConnector contract suite against Http + Fake (empty until Phase 5).
    dir: frontend
    cmds:
      - pnpm exec vitest run tests/contract --passWithNoTests

  lint:
    desc: Lint both packages.
    cmds:
      - pnpm --filter {{.BACKEND}} run lint
      - pnpm --filter {{.FRONTEND}} run lint

  format:
    desc: Format both packages.
    cmds:
      - pnpm --filter {{.BACKEND}} run format
      - pnpm --filter {{.FRONTEND}} run format

  typecheck:
    desc: Type-check both packages.
    cmds:
      - pnpm --filter {{.BACKEND}} run typecheck
      - pnpm --filter {{.FRONTEND}} run typecheck

  boundaries:
    desc: Enforce the domain/application/infrastructure/presentation dependency rule.
    cmds:
      - pnpm --filter {{.BACKEND}} run boundaries
      - pnpm --filter {{.FRONTEND}} run boundaries

  check:
    desc: The CI command — lint + typecheck + tests + boundary lint.
    cmds:
      - task: lint
      - task: typecheck
      - task: test
      - task: boundaries

  build:
    desc: Build both packages.
    cmds:
      - pnpm --filter {{.BACKEND}} run build
      - pnpm --filter {{.FRONTEND}} run build

  up:
    desc: Start the production-like stack.
    cmds:
      - docker compose -f compose.yml up -d --build

  down:
    desc: Stop the stack.
    cmds:
      - docker compose -f compose.yml down

  logs:
    desc: Tail logs for the whole stack.
    cmds:
      - docker compose -f compose.yml logs -f
